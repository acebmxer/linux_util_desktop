name: Release

# When the app version changes on main (or on demand): builds the AppImage,
# .deb and .rpm, installs each in clean Ubuntu, Fedora, openSUSE and Arch
# containers (scripts/smoke_test.sh), then attaches them with SHA256SUMS to a
# DRAFT release for that version. Publishing the draft creates the tag, so the
# files are already there when it goes public. Builds on Ubuntu 22.04 so the
# AppImage needs no newer glibc than that.
on:
  push:
    branches: [main]
    paths: ["src-tauri/tauri.conf.json"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Stop if this version is already released
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already tagged; bump the version in src-tauri/tauri.conf.json first"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev librsvg2-dev libssl-dev libayatana-appindicator3-dev \
            file xdg-utils

      - run: npm ci
      - run: npm run contract
      - run: npx tauri build

      - name: Collect release files
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          bundle=src-tauri/target/release/bundle
          mkdir release
          cp "$bundle/deb/Linux_Util Desktop_${version}_amd64.deb" \
            "release/linux_util_desktop_${version}_amd64.deb"
          cp "$bundle/rpm/Linux_Util Desktop-${version}-1.x86_64.rpm" \
            "release/linux_util_desktop-${version}-1.x86_64.rpm"
          cp "$bundle/appimage/Linux_Util Desktop_${version}_amd64.AppImage" \
            "release/linux_util_desktop_${version}_amd64.AppImage"
          cd release
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, fedora, opensuse, arch]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Verify checksums
        working-directory: release
        run: sha256sum -c SHA256SUMS

      - run: scripts/smoke_test.sh "${{ matrix.distro }}" release

  release:
    needs: smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - uses: actions/checkout@v4

      - name: Create or refresh the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "true" ]]; then
              echo "::error::$tag is already published; not touching it"
              exit 1
            fi
            gh release upload "$tag" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" release/* \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
              --title "Linux_Util Desktop $tag" \
              --notes "Checksums for every file are in SHA256SUMS."
          fi

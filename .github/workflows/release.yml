name: Release

run-name: ${{ inputs.description || github.event.head_commit.message || 'Release' }}

# When the app version changes on main, or when started by hand (Actions ->
# Release -> Run workflow, on main or dev): builds the
# AppImage, .deb and .rpm, installs each in clean Ubuntu, Fedora, openSUSE and
# Arch containers (scripts/smoke_test.sh), then attaches them with SHA256SUMS,
# signed with minisign (SHA256SUMS.minisig, key in the MINISIGN_SECRET_KEY repo
# secret; the app checks it with src-tauri/minisign.pub), to a release. Builds on Ubuntu 22.04 so the AppImage needs no newer glibc than
# that.
#
# main -> DRAFT stable release, tag v<version>. Publishing the draft creates the
#         tag, so the files are already there when it goes public.
# dev  -> only by hand. Beta pre-release, tag v<version>-beta.<n>, n counting up per version, published at once
#         (the app's update check cannot see drafts) with the files attached.
#         Pre-releases are never "latest", so only users who turned on beta
#         updates are offered them. The number is also built into the app
#         (LU_BETA_BUILD) so a beta knows which beta it is.
on:
  push:
    branches: [main]
    paths: ["src-tauri/tauri.conf.json"]
  workflow_dispatch:
    inputs:
      description:
        description: Title shown in the Actions run list (optional)
        required: false
        type: string

permissions:
  contents: read

jobs:
  # The path filter fires on any edit to tauri.conf.json. A push only releases
  # when the version itself changed; a manual run always goes ahead.
  version:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      - id: check
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          now=$(node -p "require('./src-tauri/tauri.conf.json').version")
          changed=true
          if [[ "$GITHUB_EVENT_NAME" == "push" && -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=1 origin "$BEFORE"
            before=$(git show "$BEFORE:src-tauri/tauri.conf.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
            if [[ "$before" == "$now" ]]; then
              echo "Version is still $now; tauri.conf.json changed for another reason. Not releasing."
              changed=false
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    outputs:
      beta: ${{ steps.beta.outputs.n }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Stable and beta alike: a beta of a version that is already released would
      # be labelled with the old number (v0.2.1-beta.12 after v0.2.1).
      - name: Stop if this version is already released
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already tagged; bump the version in src-tauri/tauri.conf.json (and package.json, src-tauri/Cargo.toml) on this branch first"
            exit 1
          fi

      # Betas count up per version: v0.2.2-beta.1, .2, .3. The next number is one
      # above the highest beta tag of this version already on the remote.
      - name: Number this beta
        id: beta
        if: github.ref_name != 'main'
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          last=$(git ls-remote --tags origin "refs/tags/v$version-beta.*" \
            | sed -n 's|.*-beta\.\([0-9]*\)$|\1|p' | sort -n | tail -1)
          echo "n=$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-27
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev librsvg2-dev libssl-dev libayatana-appindicator3-dev \
            file xdg-utils

      - run: npm ci
      - run: npm run contract
      - run: npx tauri build
        env:
          LU_BETA_BUILD: ${{ steps.beta.outputs.n }}

      - name: Collect release files
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          bundle=src-tauri/target/release/bundle
          mkdir release
          cp "$bundle/deb/Linux_Util Desktop_${version}_amd64.deb" \
            "release/linux_util_desktop_${version}_amd64.deb"
          cp "$bundle/rpm/Linux_Util Desktop-${version}-1.x86_64.rpm" \
            "release/linux_util_desktop-${version}-1.x86_64.rpm"
          cp "$bundle/appimage/Linux_Util Desktop_${version}_amd64.AppImage" \
            "release/linux_util_desktop_${version}_amd64.AppImage"
          cd release
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: release/
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, fedora, opensuse, arch]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: release

      - name: Verify checksums
        working-directory: release
        run: sha256sum -c SHA256SUMS

      - run: scripts/smoke_test.sh "${{ matrix.distro }}" release

  release:
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Checkout first: on an empty workspace it clears the folder, which would
      # delete files downloaded before it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: release

      - name: Release tag
        id: tag
        env:
          BETA_NUMBER: ${{ needs.build.outputs.beta }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v$version"
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            tag="v$version-beta.$BETA_NUMBER"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Signed here, after the smoke tests, so the key is only ever in this job.
      # The app refuses an update whose SHA256SUMS has no valid signature, or
      # whose signed comment does not name the tag it is installing: a beta and
      # the stable release of one version have files of the same names.
      - name: Sign SHA256SUMS
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [[ -z "$MINISIGN_SECRET_KEY" ]]; then
            echo "::error::The MINISIGN_SECRET_KEY repo secret is not set; releases must be signed"
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y minisign
          key="$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key")
          minisign -S -s "$key" -m release/SHA256SUMS -t "tag:$TAG"
          minisign -V -p src-tauri/minisign.pub -m release/SHA256SUMS | tee "$RUNNER_TEMP/verify.txt"
          if ! grep -qxF "Trusted comment: tag:$TAG" "$RUNNER_TEMP/verify.txt"; then
            echo "::error::The signature does not name $TAG; the app would refuse this release"
            exit 1
          fi

      - name: Create or refresh the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          tag=$TAG
          title="$tag"
          flags=(--draft)
          notes="Stable release. Checksums for every file are in SHA256SUMS, signed in SHA256SUMS.minisig."
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            flags=(--prerelease)  # published, not a draft: the app cannot see drafts
            # What is new in this beta is what CHANGELOG.md lists under [Unreleased].
            unreleased=$(awk '/^## \[Unreleased\]/{f=1; next} /^## \[/{f=0} f' CHANGELOG.md)
            notes=$(printf '%s\n\n%s' "Beta build from the $GITHUB_REF_NAME branch, for testing before it reaches main. Checksums for every file are in SHA256SUMS, signed in SHA256SUMS.minisig." "$unreleased")
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A beta is published on creation, so only a stable release is protected once public.
            if [[ "$GITHUB_REF_NAME" == "main" && "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "true" ]]; then
              echo "::error::$tag is already published; not touching it"
              exit 1
            fi
            # The files are rebuilt from this commit, so the tag must point here too.
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
            if [[ "$GITHUB_REF_NAME" != "main" ]]; then
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes"
            fi
            gh release upload "$tag" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" release/* \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$title" "${flags[@]}" \
              --notes "$notes"
          fi

[package]
name = "linux_util_desktop"
version = "0.3.4"
description = "Desktop front end for linux_util"
edition = "2021"
license = "MIT"

[lib]
name = "linux_util_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
libc = "0.2"
# Pinned to 3.4.x: the download guard in update.rs uses ureq's `unversioned`
# transport API, which ureq may change in a minor release (never a patch).
ureq = "~3.4"
sha2 = "0.10"
minisign-verify = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18"
